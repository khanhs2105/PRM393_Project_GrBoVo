name: chia_tien
description: "Chipin - app chia tiền nhóm và nhắc nợ (PRM393)."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  sqflite_common: ^2.5.4
  path: ^1.9.0
  path_provider: ^2.1.5
  mobile_scanner: ^7.0.0
  image_picker: ^1.2.0
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  share_plus: ^13.0.0
  gal: ^2.3.0
  sensors_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/banks.json
    - assets/brand/chipin_logo.png
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-400.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-500.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-600.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-700.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-800.ttf
          weight: 800
    - family: Lucide
      fonts:
        - asset: assets/fonts/lucide.ttf
